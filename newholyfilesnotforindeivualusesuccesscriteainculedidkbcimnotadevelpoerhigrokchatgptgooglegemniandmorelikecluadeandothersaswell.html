<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 404 Screen Styles */
        #error-screen {
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            transition: opacity 0.5s ease;
        }

        #error-code {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            position: relative;
        }

        #error-code::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 220px;
            height: 220px;
            border: 4px solid transparent;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            transition: transform 5s linear, border-color 0.3s;
            pointer-events: none;
        }

        #error-code.holding::after {
            border-color: #3b82f6;
            transform: translate(-50%, -50%) scale(1.1);
        }

        #error-message {
            font-size: 1.2rem;
            color: #9ca3af;
            margin-top: 10px;
        }

        /* Hidden Content Screen */
        #content-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.8s ease;
            background: #0b0f19;
        }

        /* Dynamic Top Bar */
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: #111827;
            padding: 10px;
            border-bottom: 1px solid #1f2937;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: #1f2937;
            color: #9ca3af;
            border: 1px solid #374151;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #374151;
            color: #ffffff;
        }

        .nav-btn.active {
            background: #3b82f6;
            color: #ffffff;
            border-color: #2563eb;
        }

        .iframe-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none;
        }
    </style>
    <script>
        // --- STRICT URL FRAME GUARD ---
        function checkFrameSecurity() {
            const isFramed = (window.self !== window.top);
            
            // The exact URL allowed to embed this page
            const targetParentUrl = "https://calcsolver.github.io/Beairgubvgiagnvprngdb-rkagdfxbak-gdinbrsgdbuitkudqwertghnbvcdswergawertyhjnbvcdrtyhujmnbvfdrtyhjnbvf/nothankyouatallbecuaseyoudontowmeanythingatallsoimnotgivingyouthelink.html";
            
            // Get the URL of the page hosting the iframe
            const parentUrl = document.referrer;

            // If it is not framed, OR the parent link doesn't match exactly, deny access
            if (!isFramed || parentUrl !== targetParentUrl) {
                window.stop(); // Stop loading further scripts/styles
                document.documentElement.innerHTML = `
                    <html style="background:#0b0f19;color:#ef4444;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100%;">
                        <body><h2>Access Denied: Unauthorized Environment.</h2></body>
                    </html>`;
            }
        }
        checkFrameSecurity();
    </script>
</head>
<body oncontextmenu="return false;">

    <div id="error-screen">
        <h1 id="error-code">404</h1>
        <p id="error-message">The page you are looking for does not exist.</p>
    </div>

    <div id="content-screen">
        <div class="nav-bar" id="dynamic-nav"></div>
        
        <div class="iframe-container">
            <iframe id="secret-iframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase configuration parameters
        const firebaseConfig = {
            apiKey: "AIzaSyD5TALVIdPm5P8RuKjINsOmKW1XrK53u1Q",
            authDomain: "testing-12bc9.firebaseapp.com",
            projectId: "testing-12bc9",
            storageBucket: "testing-12bc9.firebasestorage.app",
            messagingSenderId: "626782607651",
            appId: "1:626782607651:web:bd5848809bd1f4364a5496",
            measurementId: "G-D8D71RB750"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Elements
        const errorScreen = document.getElementById('error-screen');
        const errorCode = document.getElementById('error-code');
        const contentScreen = document.getElementById('content-screen');
        const secretIframe = document.getElementById('secret-iframe');
        const dynamicNav = document.getElementById('dynamic-nav');

        let activeDocId = null; 
        let holdTimer;
        const HOLD_DURATION = 5000; 

        // Block contextual layout scanning keys (F12, Ctrl+U, Ctrl+Shift+I)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F12') e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u') e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'i') e.preventDefault();
        });

        // Pull dynamic elements live from the "iframe" collection
        onSnapshot(collection(db, "iframe"), (querySnapshot) => {
            dynamicNav.innerHTML = "";
            let isFirst = true;

            querySnapshot.forEach((doc) => {
                const docId = doc.id; 
                const data = doc.data();
                const url = data.url || "";

                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.textContent = docId;
                btn.dataset.url = url;
                btn.dataset.id = docId;

                if ((activeDocId === null && isFirst) || activeDocId === docId) {
                    btn.classList.add('active');
                    secretIframe.src = url;
                    activeDocId = docId;
                    isFirst = false;
                }

                btn.addEventListener('click', () => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    secretIframe.src = url;
                    activeDocId = docId;
                });

                dynamicNav.appendChild(btn);
            });
        });

        // --- Press & Hold Activation Logic ---
        function startHold(e) {
            if (e.touches && e.touches.length > 1) return;
            errorCode.classList.add('holding');
            holdTimer = setTimeout(() => {
                revealSecretContent();
            }, HOLD_DURATION);
        }

        function cancelHold() {
            clearTimeout(holdTimer);
            errorCode.classList.remove('holding');
        }

        errorCode.addEventListener('mousedown', startHold);
        window.addEventListener('mouseup', cancelHold);
        errorCode.addEventListener('touchstart', startHold, { passive: true });
        window.addEventListener('touchend', cancelHold);

        // --- Transition Handler ---
        function revealSecretContent() {
            errorCode.removeEventListener('mousedown', startHold);
            errorCode.removeEventListener('touchstart', startHold);
            
            errorScreen.classList.add('hidden');
            
            setTimeout(() => {
                errorScreen.style.display = 'none';
                contentScreen.style.display = 'flex';
                setTimeout(() => {
                    contentScreen.style.opacity = '1';
                }, 50);
            }, 500); 
        }
    </script>
</body>
</html>
