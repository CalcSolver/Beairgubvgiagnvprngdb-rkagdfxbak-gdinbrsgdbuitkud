<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 404 Screen Styles */
        #error-screen {
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            transition: opacity 0.5s ease;
        }

        #error-code {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            position: relative;
        }

        /* Subtle animated scaling ring when holding down */
        #error-code::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 220px;
            height: 220px;
            border: 4px solid transparent;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            transition: transform 5s linear, border-color 0.3s;
            pointer-events: none;
        }

        #error-code.holding::after {
            border-color: #3b82f6;
            transform: translate(-50%, -50%) scale(1.1);
        }

        #error-message {
            font-size: 1.2rem;
            color: #9ca3af;
            margin-top: 10px;
        }

        /* Hidden Content Styles */
        #content-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="error-screen">
        <h1 id="error-code">404</h1>
        <p id="error-message">The page you are looking for does not exist.</p>
    </div>

    <div id="content-screen">
        <iframe id="secret-iframe" src="" allowfullscreen></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your provided Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD5TALVIdPm5P8RuKjINsOmKW1XrK53u1Q",
            authDomain: "testing-12bc9.firebaseapp.com",
            projectId: "testing-12bc9",
            storageBucket: "testing-12bc9.firebasestorage.app",
            messagingSenderId: "626782607651",
            appId: "1:626782607651:web:bd5848809bd1f4364a5496",
            measurementId: "G-D8D71RB750"
        };

        // Initialize App, Analytics, and Firestore
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // DOM Elements
        const errorScreen = document.getElementById('error-screen');
        const errorCode = document.getElementById('error-code');
        const contentScreen = document.getElementById('content-screen');
        const secretIframe = document.getElementById('secret-iframe');

        let holdTimer;
        const HOLD_DURATION = 5000; // 5000 milliseconds = 5 seconds

        // Stream link changes seamlessly from Firestore
        // Looks for Collection: "iframe", Document ID: "config"
        onSnapshot(doc(db, "iframe", "config"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.url) {
                    secretIframe.src = data.url;
                }
            } else {
                console.warn("Firestore document 'iframe/config' not found. Please create it in your console.");
            }
        });

        // --- Press & Hold Core Logic ---
        
        function startHold(e) {
            // Only allow activation if exactly one finger/click pointer is touching
            if (e.touches && e.touches.length > 1) return;
            
            errorCode.classList.add('holding');
            
            holdTimer = setTimeout(() => {
                revealSecretContent();
            }, HOLD_DURATION);
        }

        function cancelHold() {
            clearTimeout(holdTimer);
            errorCode.classList.remove('holding');
        }

        // Mouse Controls
        errorCode.addEventListener('mousedown', startHold);
        window.addEventListener('mouseup', cancelHold);

        // Touch Controls (Mobile/Tablet)
        errorCode.addEventListener('touchstart', startHold, { passive: true });
        window.addEventListener('touchend', cancelHold);

        // --- Transition Effect ---
        function revealSecretContent() {
            // Strip hold event listeners once unlocked
            errorCode.removeEventListener('mousedown', startHold);
            errorCode.removeEventListener('touchstart', startHold);
            
            // Graceful fade transitions
            errorScreen.classList.add('hidden');
            
            setTimeout(() => {
                errorScreen.style.display = 'none';
                contentScreen.style.display = 'block';
                setTimeout(() => {
                    contentScreen.style.opacity = '1';
                }, 50);
            }, 500); 
        }
    </script>
</body>
</html>
