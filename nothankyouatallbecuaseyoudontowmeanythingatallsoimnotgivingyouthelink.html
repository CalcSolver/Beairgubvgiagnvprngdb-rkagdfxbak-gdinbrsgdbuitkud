<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 404 Screen Styles */
        #error-screen {
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            transition: opacity 0.5s ease;
        }

        #error-code {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            position: relative;
        }

        #error-code::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 220px;
            height: 220px;
            border: 4px solid transparent;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            transition: transform 5s linear, border-color 0.3s;
            pointer-events: none;
        }

        #error-code.holding::after {
            border-color: #3b82f6;
            transform: translate(-50%, -50%) scale(1.1);
        }

        #error-message {
            font-size: 1.2rem;
            color: #9ca3af;
            margin-top: 10px;
        }

        /* Auth Panel Styles */
        #auth-screen {
            display: none;
            flex-direction: column;
            background: #111827;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #1f2937;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        #auth-screen h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .auth-btn {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        .auth-btn:hover {
            background: #2563eb;
        }

        .toggle-mode {
            background: none;
            border: none;
            color: #3b82f6;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 15px;
            text-align: center;
            text-decoration: underline;
            width: 100%;
        }

        #auth-error {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }

        /* Hidden Content Screen */
        #content-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background: #0b0f19;
        }

        .iframe-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="error-screen">
        <h1 id="error-code">404</h1>
        <p id="error-message">The page you are looking for does not exist.</p>
    </div>

    <div id="auth-screen">
        <h2 id="auth-title">System Authentication</h2>
        <div class="input-group">
            <label for="email">User Registry Email</label>
            <input type="email" id="email" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="password">Security Token</label>
            <input type="password" id="password">
        </div>
        <button id="auth-submit-btn" class="auth-btn">Verify Identity</button>
        <button id="auth-toggle-btn" class="toggle-mode">Need an account? Sign Up</button>
        <div id="auth-error"></div>
    </div>

    <div id="content-screen">
        <div class="iframe-container">
            <iframe id="secret-iframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Firebase configuration parameters
        const firebaseConfig = {
            apiKey: "AIzaSyD5TALVIdPm5P8RuKjINsOmKW1XrK53u1Q",
            authDomain: "testing-12bc9.firebaseapp.com",
            projectId: "testing-12bc9",
            storageBucket: "testing-12bc9.firebasestorage.app",
            messagingSenderId: "626782607651",
            appId: "1:626782607651:web:bd5848809bd1f4364a5496",
            measurementId: "G-D8D71RB750"
        };

        // Initialize Firebase services
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // UI Selectors
        const errorScreen = document.getElementById('error-screen');
        const errorCode = document.getElementById('error-code');
        const authScreen = document.getElementById('auth-screen');
        const contentScreen = document.getElementById('content-screen');
        const secretIframe = document.getElementById('secret-iframe');
        
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const authToggleBtn = document.getElementById('auth-toggle-btn');
        const authTitle = document.getElementById('auth-title');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const authError = document.getElementById('auth-error');

        let holdTimer;
        const HOLD_DURATION = 5000; 
        let unsubscribeDoc = null; 
        let isLoginMode = true; // State tracking for Sign In vs Sign Up

        // Prevent environment scanning inspection shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F12') e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u') e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'i') e.preventDefault();
        });

        // Toggle interface state between Login and Sign Up modes
        authToggleBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                authTitle.textContent = "System Authentication";
                authSubmitBtn.textContent = "Verify Identity";
                authToggleBtn.textContent = "Need an account? Sign Up";
            } else {
                authTitle.textContent = "Register Account";
                authSubmitBtn.textContent = "Create Profile";
                authToggleBtn.textContent = "Already registered? Sign In";
            }
            authError.textContent = "";
        });

        // Process active session states
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authScreen.style.display = 'none';
                errorScreen.style.display = 'none';
                contentScreen.style.display = 'flex';

                // Establish clean read pipeline to exact document ID
                unsubscribeDoc = onSnapshot(doc(db, "iframe", "Lu7ku0kzfjMiRLymjhrV"), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.url && secretIframe.src !== data.url) {
                            secretIframe.src = data.url;
                        }
                    }
                }, (error) => {
                    console.error("Pipeline disconnected:", error);
                });
            } else {
                if (unsubscribeDoc) {
                    unsubscribeDoc();
                    unsubscribeDoc = null;
                }
                secretIframe.src = "";
            }
        });

        // Action submission handler
        authSubmitBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            authError.textContent = "";

            if (!email || !password) {
                authError.textContent = "All fields required.";
                return;
            }

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
            } catch (err) {
                if (isLoginMode) {
                    authError.textContent = "Invalid credential token verified.";
                } else {
                    authError.textContent = err.message.replace("Firebase: ", "");
                }
            }
        });

        // --- Interaction Hold Listeners ---
        function startHold(e) {
            if (e.touches && e.touches.length > 1) return;
            errorCode.classList.add('holding');
            holdTimer = setTimeout(() => {
                revealAuthGateway();
            }, HOLD_DURATION);
        }

        function cancelHold() {
            clearTimeout(holdTimer);
            errorCode.classList.remove('holding');
        }

        errorCode.addEventListener('mousedown', startHold);
        window.addEventListener('mouseup', cancelHold);
        errorCode.addEventListener('touchstart', startHold, { passive: true });
        window.addEventListener('touchend', cancelHold);

        function revealAuthGateway() {
            errorCode.removeEventListener('mousedown', startHold);
            errorCode.removeEventListener('touchstart', startHold);
            
            if (auth.currentUser) {
                errorScreen.style.display = 'none';
                contentScreen.style.display = 'flex';
            } else {
                errorScreen.style.display = 'none';
                authScreen.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
