    <style>
        :root { 
            --bg: #0d0e15; 
            --card-bg: #161824;
            --accent: #6366f1; 
            --accent-hover: #4f46e5;
            --text-main: #ffffff;
            --text-muted: #9ca3af; 
            --input-bg: #1f2235;
            --border: #2d3142; 
            --warning-bg: rgba(239, 68, 68, 0.1);
            --warning-border: #ef4444;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { background: #fff; color: #222; overflow: hidden; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        /* DECOY 404 THEME */
        #decoy { 
            position: fixed; inset: 0; background: #fff; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 20px; text-align: center; cursor: default; user-select: none; 
            -webkit-user-select: none;
        }
        #decoy h1 { font-size: 5rem; color: #1f2937; margin-bottom: 10px; font-weight: 800; }
        #decoy p { font-size: 1.2rem; color: #4b5563; margin-bottom: 25px; }
        
        .interactive-trigger {
            background: #1f2937;
            color: #fff;
            border: 1px solid #374151;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .interactive-trigger:hover { background: #374151; }

        /* AUTH & PORTAL LAYOUTS */
        #auth-overlay { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: var(--bg); 
            z-index: 10000; 
            align-items: center; 
            justify-content: center; 
        }
        
        .card { 
            width: 380px; 
            padding: 35px 25px; 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            text-align: center; 
            color: var(--text-main);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        .card h2 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .warning-box {
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        input, textarea { 
            width: 100%; 
            padding: 14px 16px; 
            margin-bottom: 16px; 
            background: var(--input-bg); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            color: #fff; 
            font-size: 14px;
        }
        
        textarea { height: 80px; resize: none; font-family: inherit; }
        input:focus, textarea:focus { border-color: var(--accent); }

        .btn { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            background: var(--accent); 
            color: white; 
            font-weight: 600; 
            font-size: 15px;
            cursor: pointer; 
        }
        .btn:hover { background: var(--accent-hover); }

        .toggle-link {
            margin-top: 20px; 
            font-size: 13px; 
            color: var(--text-muted); 
            cursor: pointer;
            display: inline-block;
        }
        .toggle-link:hover { color: var(--accent); }

        #portal { display: none; position: fixed; inset: 0; flex-direction: column; background: var(--bg); color: #fff; }
        #nav { height: 70px; background: rgba(0,0,0,0.2); display: flex; align-items: center; padding: 0 25px; border-bottom: 1px solid var(--border); gap: 12px; }
        .nav-logo { font-weight: 700; color: var(--accent); font-size: 20px; letter-spacing: 1px; }
        
        .nav-action-btn {
            background: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13px;
            padding: 8px 16px;
            transition: all 0.2s ease;
        }
        #refresh-btn { border: 1px solid var(--accent); color: var(--accent); }
        #refresh-btn:hover { background: var(--accent); color: #fff; }
        #logout-btn { border: 1px solid #ff4b4b; color: #ff4b4b; }
        #logout-btn:hover { background: #ff4b4b; color: #fff; }
        
        iframe { flex: 1; border: none; width: 100%; height: 100%; }

        @media (max-width: 600px) {
            .card { width: 90%; padding: 30px 20px; }
        }
    </style>
</head>

    <div id="decoy">

        <button id="decoy-trigger" class="interactive-trigger">Return Home</button>
    </div>

    <div id="auth-overlay">
        <div class="card">

                <input type="password" id="r-pass" placeholder="Password">
                <textarea id="r-note" placeholder="Add a note..."></textarea>
                <button class="btn" id="submit-req">SUBMIT REQUEST</button>
                <div onclick="toggleAuth(false)" class="toggle-link">Back to Login</div>
            </div>
        </div>
    </div>

    <div id="portal">
        <div id="nav">

            <div style="flex:1"></div>

        </div>
        <iframe id="portal-frame" src="about:blank" allowfullscreen></iframe>
    </div>
