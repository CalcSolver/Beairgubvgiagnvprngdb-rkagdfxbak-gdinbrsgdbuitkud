<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Console</title>
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --border-color: #1f2937;
            --text-active: #ffffff;
            --text-inactive: #9ca3af;
            --accent-color: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-active);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar */
        .nav-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            white-space: nowrap;
            /* Allow scrolling but hide native ugly scrollbars, adding smooth behavior */
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .nav-bar::-webkit-scrollbar {
            height: 4px;
        }
        .nav-bar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .nav-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent-color);
            margin-right: 10px;
            flex-shrink: 0;
        }

        .tabs-wrapper {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: #1f2937;
            color: var(--text-inactive);
            border: 1px solid #374151;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
            user-select: none;
        }

        .nav-btn:hover {
            background: #374151;
            color: var(--text-active);
        }

        .nav-btn.active {
            background: var(--accent-color);
            color: var(--text-active);
            border-color: #2563eb;
        }

        /* Viewport Container */
        .viewport-container {
            flex-grow: 1;
            width: 100%;
            position: relative;
            background: #000000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            background: transparent;
        }

        /* Customizable Fallback Message Notice */
        .fallback-notice {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background: #0f172a;
            color: #94a3b8;
            text-align: center;
            z-index: 1;
        }

        .fallback-notice p {
            max-width: 500px;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .open-link-btn {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .open-link-btn:hover {
            background: #2563eb;
        }
    </style>
    <script>
        // --- DOMAIN FRAME GUARD ---
        function checkFrameSecurity() {
            const isFramed = (window.self !== window.top);
            const allowedDomain = "https://calcsolver.github.io";
            
            try {
                const parentReferrer = document.referrer;
                const parentOrigin = parentReferrer ? new URL(parentReferrer).origin : "";

                if (!isFramed || parentOrigin !== allowedDomain) {
                    window.stop(); 
                    document.documentElement.innerHTML = `
                        <html style="background:#0b0f19;color:#ef4444;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100%;">
                            <body><h2>Access Denied: Unauthorized Domain Environment.</h2></body>
                        </html>`;
                }
            } catch (e) {
                window.stop();
                document.documentElement.innerHTML = `<html style="background:#0b0f19;"><body style="color:#ef4444; text-align:center; padding-top:20%;"><h2>Access Denied</h2></body></html>`;
            }
        }
        checkFrameSecurity();
    </script>
</head>
<body>

    <div class="nav-bar">
        <span class="nav-title">PORTAL</span>
        <div class="tabs-wrapper" id="navigation-tabs"></div>
    </div>
    
    <div class="viewport-container">
        <div class="fallback-notice">
            <p id="fallback-text">
                It seems the website that you have tried to access doesn't work inside the previewer frame. You can use the button below to launch it directly, or notify the developer to verify the source status!
            </p>
            <a id="direct-link" href="#" target="_blank" class="open-link-btn">Open Link Directly</a>
        </div>

        <iframe id="main-viewport" src="about:blank" allowfullscreen></iframe>
    </div>

    <script type="module">
        // Active server links tracking map
        const externalTargets = [
            { label: "Relic url 1", url: "https://lightspeedyeahbrody.b-cdn.net/" },
            { label: "Studyhub url 1", url: "https://rkmathtech3.parcomunica.com/" },
            { label: "Studyhub url 2", url: "https://mathschool8tech.art-motel.com/" },
            { label: "Relic url 2", url: "https://education.fun-school.globalgeocad.ro/" },
            { label: "Sonic & Mario", url: "https://www.fanfreegames.com/g/sonic-super-mario-world" },
            { label: "Wii Index", url: "https://raw.githack.com/CalcSolver/Wii/main/index.html" },
            { label: "Itch Engine", url: "https://html-classic.itch.zone/html/9737734/index.html?v=1732313593" },
            { label: "Server 8", url: "https://example.com/placeholder8" },
            { label: "Server 9", url: "https://example.com/placeholder9" },
            { label: "Server 10", url: "https://example.com/placeholder10" },
            { label: "Server 11", url: "https://example.com/placeholder11" },
            { label: "Server 12", url: "https://example.com/placeholder12" },
            { label: "Server 13", url: "https://example.com/placeholder13" },
            { label: "Server 14", url: "https://example.com/placeholder14" },
            { label: "Server 15", url: "https://example.com/placeholder15" },
            { label: "Server 16", url: "https://example.com/placeholder16" },
            { label: "Server 17", url: "https://example.com/placeholder17" },
            { label: "Server 18", url: "https://example.com/placeholder18" },
            { label: "Server 19", url: "https://example.com/placeholder19" },
            { label: "Server 20", url: "https://example.com/placeholder20" }
        ];

        const tabsContainer = document.getElementById('navigation-tabs');
        const viewport = document.getElementById('main-viewport');
        const directLink = document.getElementById('direct-link');

        function loadUrl(targetUrl, activeElement) {
            if (!targetUrl) return;
            
            // Clear page source first to handle transitions elegantly
            viewport.src = "about:blank";
            
            setTimeout(() => {
                viewport.src = targetUrl;
            }, 10);
            
            directLink.href = targetUrl;

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            activeElement.classList.add('active');
        }

        function setupNavigation() {
            externalTargets.forEach((target, index) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.textContent = target.label;
                
                btn.addEventListener('click', () => {
                    loadUrl(target.url, btn);
                });

                tabsContainer.appendChild(btn);

                if (index === 0) {
                    loadUrl(target.url, btn);
                }
            });
        }

        setupNavigation();
    </script>
</body>
</html>
